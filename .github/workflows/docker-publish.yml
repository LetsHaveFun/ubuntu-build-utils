name: Docker-build-and-push
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    # Publish tagged image.
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build an image from Dockerfile
        run: |
          docker build -t ghcr.io/letshavefun/ubuntu-build-utils:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/letshavefun/ubuntu-build-utils:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          scanners: 'vuln'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

  deploy:
    name: PushImage
    needs: scan
    runs-on: ubuntu-latest
    env:
      IMAGE_PATH: "ghcr.io/letshavefun/ubuntu-build-utils"
      IMAGE_TAG: "null"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image tag
        run: |
          # Strip git ref prefix from version
          if echo "${{ github.ref }}" | grep -q tags; then
            VER=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,' | sed -e 's/^v//')
            echo "Found TAG $VER"
          else
            VER=latest
            echo "No TAG found, Use latest"
          fi
          echo "IMAGE_TAG=$VER" >> $GITHUB_ENV
      - name: Build new image name
        run: |
          IMAGE_NAME="${{ env.IMAGE_PATH }}:${{ env.IMAGE_TAG }}"
          echo "IMAGE_NAME - $IMAGE_NAME"
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
      - name: Print GitHub environment
        run: |
          echo "IMAGE_PATH - ${{ env.IMAGE_PATH }}"
          echo "IMAGE_TAG - ${{ env.IMAGE_TAG }}"
          echo "IMAGE_NAME - ${{ env.IMAGE_NAME }}"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ env.IMAGE_NAME }}
            ${{ github.ref_type == 'tag' && format('{0}:latest', env.IMAGE_PATH) || '' }}
